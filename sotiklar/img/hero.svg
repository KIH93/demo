<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Иллюстрация: смартфон и инструменты мастера">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3d44"/><stop offset="1" stop-color="#1c1e22"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D92B0C"/><stop offset="1" stop-color="#8f1c08"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D92B0C" stop-opacity=".45"/><stop offset="1" stop-color="#D92B0C" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="210" cy="210" r="200" fill="url(#glow)"/>
  <circle cx="210" cy="210" r="150" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2" stroke-dasharray="4 10"/>
  <!-- телефон -->
  <g transform="rotate(-10 210 210)">
    <rect x="135" y="70" width="150" height="280" rx="26" fill="url(#g1)" stroke="#5a5e66" stroke-width="3"/>
    <rect x="147" y="90" width="126" height="240" rx="14" fill="url(#g2)"/>
    <rect x="190" y="78" width="40" height="6" rx="3" fill="#0e0f11"/>
    <!-- трещина, которую чиним -->
    <path d="M250 110 l-22 30 l14 8 l-30 42 l18 6 l-26 40" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- галочка "готово" -->
    <circle cx="186" cy="268" r="26" fill="#fff" fill-opacity=".14"/>
    <path d="M174 268 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- отвёртка -->
  <g transform="rotate(38 320 300)">
    <rect x="300" y="210" width="30" height="78" rx="12" fill="#D92B0C"/>
    <rect x="304" y="222" width="4" height="54" rx="2" fill="#fff" fill-opacity=".35"/>
    <rect x="311" y="288" width="8" height="78" rx="3" fill="#c9ccd2"/>
    <path d="M311 366 h8 l-4 12 z" fill="#c9ccd2"/>
  </g>
  <!-- пинцет -->
  <g transform="rotate(-28 90 290)" fill="none" stroke="#c9ccd2" stroke-width="6" stroke-linecap="round">
    <path d="M80 200 L74 330"/><path d="M100 200 L106 330"/><path d="M80 200 Q90 188 100 200"/>
  </g>
  <!-- винтики -->
  <g fill="#c9ccd2"><circle cx="330" cy="120" r="9"/><circle cx="360" cy="160" r="6"/><circle cx="70" cy="140" r="7"/></g>
  <g stroke="#1c1e22" stroke-width="2.5" stroke-linecap="round"><path d="M325 120 h10 M330 115 v10"/><path d="M357 160 h6"/><path d="M66 140 h8"/></g>
</svg>
